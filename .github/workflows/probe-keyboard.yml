name: Probe keyboard tests
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: [07a0a19c93d6a24fc03bcf2995fce5cd34b1666a, 5ca9b145e67433c983eec360833189cd667fb0a9]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: probe
          persist-credentials: false
      - run: cp probe/tests/zz-debug.test.cjs tests/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      - run: npx playwright install chromium
      - name: Run caravan keyboard tests
        run: |
          export TEST_ARTIFACT_DIR=$PWD/test-results/probe
          mkdir -p $TEST_ARTIFACT_DIR
          export CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          for i in 1 2 3; do node --test --test-concurrency=1 --test-reporter=spec tests/zz-debug.test.cjs 2>&1 | grep -E "BEFORE|AFTER|SAMEEL|FOCUSLOG|✖|✔"; done
