name: Post-deployment Pages smoke
on:
  deployment_status:
permissions:
  contents: read
jobs:
  deployed-smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke-test fixed production URL (never follow an event-provided URL)
        env:
          SMOKE_BASE_URL: https://gkoromilas01.github.io/Shattered-Crowns/
          TEST_ARTIFACT_DIR: test-results/post-deployment
        run: npm run test:smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deployment-evidence
          path: test-results/
          retention-days: 7
