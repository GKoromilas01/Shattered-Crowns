name: v0.26 playable art sample
on:
  pull_request:
    paths: ['samples/v026/**', '.github/workflows/v026-art-sample.yml']
  push:
    branches: ['feat/v026-art-sample']
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build sample from exact released source and verify atlas
        run: node samples/v026/build.cjs
      - name: Check native play, rendering purity and fallback
        shell: bash
        run: |
          python3 -m http.server 8026 --directory work/v026-playable > work/sample-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node -e 'const u="http://127.0.0.1:8026";(async()=>{for(let i=0;i<40;i++){try{if((await fetch(u)).ok)return}catch{}await new Promise(r=>setTimeout(r,250))}process.exit(1)})()'
          node samples/v026/check.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: v026-throwaway-playable-art-sample
          path: work/v026-playable/
          retention-days: 30
          if-no-files-found: error
